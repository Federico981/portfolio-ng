<section class="skills-section">
  <h2>💼 {{ "PROJECTS.SKILLS" | translate }}</h2>
  <div class="skills-grid">
    <div class="skill-card" *ngFor="let skill of skills">
      <img [src]="skill.icon" [alt]="skill.name" class="skill-icon" />
      <div class="skill-info">
        <h3>{{ skill.name }}</h3>
        <p>{{ skill.level }}</p>
      </div>
    </div>
  </div>
</section>

<section class="projects-section">
  <h2 class="titleProjects">
    🚀 {{ "PROJECTS.REALIZED_PROJECTS" | translate }}
  </h2>
  <div class="projects-grid">
    <div class="project-card" *ngFor="let project of projects">
      <img [src]="project.img" [alt]="project.name" class="project-img" />
      <div class="project-info">
        <h3>{{ project.name }}</h3>
        <p class="technologies">
          <span *ngFor="let tech of project.technologies" class="tech-badge">
            {{ tech }}
          </span>
        </p>
      </div>
    </div>
  </div>
</section>

<section class="projects-section">
  <app-sender-quiz></app-sender-quiz>
</section>
