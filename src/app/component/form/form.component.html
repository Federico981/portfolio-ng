<form (ngSubmit)="sendForm()" #contactForm="ngForm" novalidate>
  <h2>{{ "CONTACT.ME" | translate }}</h2>
  <p>{{ "CONTACT.FORM_SUBTITLE" | translate }}</p>

  <label for="name">{{ "CONTACT.NAME" | translate }}</label>
  <input
    id="name"
    name="name"
    [(ngModel)]="form.name"
    type="text"
    [placeholder]="'CONTACT.NAME_PLACEHOLDER' | translate"
    required
  />

  <label for="email">{{ "CONTACT.EMAIL" | translate }}</label>
  <input
    id="email"
    name="email"
    [(ngModel)]="form.email"
    type="email"
    [placeholder]="'CONTACT.EMAIL_PLACEHOLDER' | translate"
    required
  />

  <label for="sentences">{{ "CONTACT.MESSAGES" | translate }}</label>
  <textarea
    id="sentences"
    name="sentences"
    [(ngModel)]="form.sentences"
    [placeholder]="'CONTACT.MESSAGE_PLACEHOLDER' | translate"
    rows="5"
    required
  ></textarea>

  <button type="submit" [disabled]="!contactForm.form.valid">
    {{ "CONTACT.SEND" | translate }}
  </button>

  <p class="privacy-note">
    {{ "CONTACT.TREATMENT_DATA" | translate }}
    <a
      href="https://www.privacypolicies.com/live/8d12b245-7523-42af-92ab-978c58a20ebd"
      target="_blank"
      rel="noopener noreferrer"
    >
      privacy policy
    </a>
    .
  </p>

  <p class="thank-you" *ngIf="thankYouMessage">
    Grazie per avermi contattato! Ti risponderò presto.
  </p>
</form>
